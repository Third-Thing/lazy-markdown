[package]
name = "lazy-markdown"
description = "The laziest, most efficient markdown editor (citation needed)."
readme = "README.md"
edition = "2024"
version = "0.3.1"
license = "BlueOak-1.0.0"
repository = "https://github.com/Third-Thing/lazy-markdown"

[dependencies]
floem = { git = "https://github.com/Third-Thing/floem.git", branch = "dirty-tracking-and-stale-cursor-crash-fix" }
atomic-write-file = { version = "0.3.0", features = ["unnamed-tmpfile"] }
