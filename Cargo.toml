[workspace]
members = [
    "crates/core",
    "crates/app",
]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "BlueOak-1.0.0"
repository = "https://github.com/Third-Thing/lazy-markdown"

[workspace.dependencies]
lazy-markdown-core = { path = "crates/core" }
floem = { git = "https://github.com/Third-Thing/floem.git", rev = "16ff6bea81b77ac3b09ee02e45ab1857f0f9e731" }
atomic-write-file = { version = "0.3.0", features = ["unnamed-tmpfile"] }
