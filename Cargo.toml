[package]
name = "lazy-markdown"
description = "The laziest, most efficient markdown editor (citation needed)."
readme = "README.md"
edition = "2024"
version = "0.4.2"
license = "BlueOak-1.0.0"
repository = "https://github.com/Third-Thing/lazy-markdown"

[dependencies]
atomic-write-file = { version = "0.3.0", features = ["unnamed-tmpfile"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }
