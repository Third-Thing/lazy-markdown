[package]
name = "lazy-markdown-gpui-editor-probe"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { path = "/my/src/gpui-component/crates/ui" }
gpui-component-assets = { path = "/my/src/gpui-component/crates/assets" }

[patch.crates-io]
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }
